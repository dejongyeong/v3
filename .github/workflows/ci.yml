name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:

# ci checks only require the default read access
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v7

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: 🛠️ Install pnpm
        run: npm install -g pnpm@12.10.1

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚨 Lint and format check
        run: pnpm lint

      - name: 🛠️ Build workspace
        run: pnpm build

      - name: 🔎 Type check
        run: pnpm check-types

      - name: 🧪 API unit tests
        run: pnpm --filter api test

      - name: 🧪 API E2E tests
        run: pnpm --filter api test:e2e

  integration:
    name: webhook
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v7

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: 🛠️ Install pnpm
        run: npm install -g pnpm@12.10.1

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # builds the api and shared packages for the integration run.background:
      # the normal build does not need an api url or signing key while the page remains
      # request-time rendered
      - name: 🛠️ Build workspace
        run: pnpm build

      # generated pair is test only, stored outside the repo, and never uploaded
      # as an artifact or used by prod environment.
      # RUNNER_TEMP is a temporary directory provided by GitHub Actions for storing temporary files.
      - name: ✨ Generate temporary signing keys
        shell: bash
        # exit immediately if a command exits with a non-zero status, if an undefined variable is used, or if any command in a pipeline fails
        # mask each .pem line in case a process unexpectedly logs one
        run: |
          set -euo pipefail
          private_key="${RUNNER_TEMP}/test-private-key.pem"
          public_key="${RUNNER_TEMP}/test-public-key.pem"
           
          openssl genpkey -algorithm Ed25519 -out "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"

          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              printf '::add-mask::%s\n' "$line"
            fi
          done < "$private_key"

          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              printf '::add-mask::%s\n' "$line"
            fi
          done < "$public_key"

      - name: 🚀 Start local API
        shell: bash
        run: |
          set -euo pipefail
          api_log="${RUNNER_TEMP}/portfolio-api.log"
          api_pid="${RUNNER_TEMP}/portfolio-api.pid"
          : > "$api_log"

          setsid bash -c '
            export NODE_ENV=test 
            export PORT=3001
            export NEST_API_SIGNING_PUBLIC_KEY="$(cat "$RUNNER_TEMP/test-public-key.pem")"
            exec pnpm --filter api start:prod
          ' > "$api_log" 2>&1 &

          echo "$!" > "$api_pid"

          sleep 2
          if ! kill -0 "$(cat "$api_pid")" 2>/dev/null; then
            cat "$api_log"
            echo "API process exited during startup" >&2
            exit 1
          fi

      - name: ⏳ Wait for the API guard to response
        shell: bash
        # an unauthenticated 401 confirms the api route and guard are up
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/v1 || true)"

            if [ "$status" = '401' ]; then
              exit 0
            fi
            sleep 1
          done

          cat "${RUNNER_TEMP}/portfolio-api.log"
          echo "API did not become ready" >&2
          exit 1

      - name: ✔️ Verify the page renders the signed API response
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3000/ | grep --quiet --fixed-strings 'Hello World!'; then
              exit 0
            fi
            sleep 2
          done

          for log_file in "${RUNNER_TEMP}/portfolio-api.log" "${RUNNER_TEMP}/portfolio-web.log"; do
            if [ -f "$log_file" ]; then
              tail --lines=100 "$log_file"
            else
              echo "Log file $log_file does not exist" >&2
            fi
          done
          echo "Page did not render the expected content" >&2
          exit 1

      - name: 🛑 Stop local API test servers
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for pid_file in "${RUNNER_TEMP}"/portfolio-api.pid \
                          "${RUNNER_TEMP}"/portfolio-web.pid; do
            if [ -f "$pid_file" ]; then
              pid="$(cat "$pid_file")"
              kill -- "-${pid}" 2>/dev/null || kill "$pid" 2>/dev/null || true
            fi
          done

          rm -f \
            "${RUNNER_TEMP}/test-private-key.pem" \
            "${RUNNER_TEMP}/test-public-key.pem"
