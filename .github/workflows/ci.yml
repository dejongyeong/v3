name: ci

on:
  pull_request:
    branches: [main]
  workflow_call:

# ci checks only require the default read access
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v7

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: 🛠️ Install pnpm
        run: npm install -g pnpm@12.10.1

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚨 Lint and format check
        run: pnpm lint

      - name: 🛠️ Build workspace
        run: pnpm build

      - name: 🔎 Type check
        run: pnpm check-types

      - name: 🧪 API unit tests
        run: pnpm --filter api test

      - name: 🧪 API E2E tests
        run: pnpm --filter api test:e2e

  integration:
    name: Webhook
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v7

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: 🛠️ Install pnpm
        run: npm install -g pnpm@12.10.1

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # builds the api and shared packages for the integration run.background:
      # the normal build does not need an api url or signing key while the page remains
      # request-time rendered
      - name: 🛠️ Build workspace
        run: pnpm build

      # generated pair is test only, stored outside the repo, and never uploaded
      # as an artifact or used by prod environment.
      # RUNNER_TEMP is a temporary directory provided by GitHub Actions for storing temporary files.
      - name: ✨ Generate temporary signing keys
        shell: bash
        run: |
          private_key="${RUNNER_TEMP}/test-private-key.pem"
          public_key="${RUNNER_TEMP}/test-public-key.pem"
           
          private_delimiter="PRIVATE_$(openssl rand -hex 16)" 
          public_delimiter="PUBLIC_$(openssl rand -hex 16)"

          openssl genpkey -algorithm Ed25519 -out "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"

          {
            printf 'NEST_API_SIGNING_PRIVATE_KEY<<%s\n' "$private_delimiter"
            cat "$private_key"
            printf '\n%s\n' "$private_delimiter"
            
            printf 'NEST_API_SIGNING_PUBLIC_KEY<<%s\n' "$public_delimiter"
            cat "$public_key"
            printf '\n%s\n' "$public_delimiter"
            
            printf 'NEST_API_BASE_URL=http://127.0.0.1:3001\n'
          } >> "$GITHUB_ENV"

      - name: 🚀 Start local API
        shell: bash
        run: |
          nohup env NODE_ENV=test PORT=3001 \
            pnpm --filter api start:prod \
            > "$RUNNER_TEMP/portfolio-api.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/portfolio-api.pid"

      - name: ⏳ Wait for the API guard to response
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/v1 || true)"

            if [ "$status" = '401' ]; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/portfolio-api.log"
          echo "API did not become ready" >&2
          exit 1

      - name: ✔️ Verify the page renders the signed API response
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:3000/ | grep --quiet 'Hello World!'; then
              exit 0
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/portfolio-api.log"
          cat "${RUNNER_TEMP}/portfolio-web.log"
          echo "Page did not render the expected content" >&2
          exit 1

      - name: 🛑 Stop local API test servers
        if: ${{ always() }}
        shell: bash
        run: |
          for pid_file in "${RUNNER_TEMP}"/portfolio-api.pid \
                          "${RUNNER_TEMP}"/portfolio-web.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
