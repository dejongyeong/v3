name: deploy api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - .dockerignore
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-api.yml"
      - ".releaserc.json"

permissions:
  contents: read

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: deploy
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/portfolio-api:${{ github.sha }}
    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v7

      - name: 🔑 Authenticate with Google Cloud using WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: 🛠️ Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: 🔑 Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: 🛠️ Build and push Docker API image
        run: |
          docker buildx build --platform linux/amd64 --file apps/api/Dockerfile --tag "$IMAGE" --push .

      - name: 🚀 Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --port 8080 \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars NODE_ENV=production \
            --set-secrets NEST_API_SIGNING_PUBLIC_KEY=nest-api-signing-public-key:1 \
            --allow-unauthenticated \
            --quiet

  release:
    name: release
    needs: [ci, deploy]
    if: >-
      github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout complete history and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.11.1
          package-manager-cache: false

      - name: 📦 Install pnpm
        run: npm install -g pnpm@12.10.1

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Run semantic-release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
